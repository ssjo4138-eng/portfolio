<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Portfolio 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-color: #1A1A1D;
            --card-bg: #222225;
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0B0;
            --accent: #E5E5E5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 40px 20px;
        }
        header { text-align: center; margin-bottom: 60px; }
        header h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 10px; }
        header p { color: var(--text-secondary); font-size: 1.1rem; }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        .thumbnail-container {
            width: 100%;
            height: 200px;
            background: #333;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .skeleton { background: linear-gradient(90deg, #333 25%, #444 50%, #333 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        
        .card h3 { font-size: 1.2rem; margin-bottom: 5px; }
        .card p { font-size: 0.9rem; color: var(--text-secondary); }

        /* Modal */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { width: 90%; height: 90%; background: #fff; overflow-y: auto; position: relative; border-radius: 8px; }
        .close-btn { position: absolute; top: 10px; right: 20px; font-size: 40px; color: #fff; cursor: pointer; z-index: 1001; }
        #pdf-viewer { width: 100%; }
        .page-canvas { display: block; margin: 0 auto; width: 100%; }
    </style>
</head>
<body>

<header>
    <h1>Marketing Portfolio 2026</h1>
    <p>데이터를 치밀하게 분석하여 기획에 반영할 수 있는 스마트 마케터 여기있습니다.</p>
</header>

<div class="container">
    <div class="card" onclick="openModal('./midasitseojeongeun20260422-압축됨.pdf')">
        <div id="thumb-1" class="thumbnail-container skeleton"></div>
        <h3>midas it marketing portfolio report</h3>
        <p>작성자: seo jeong eun</p>
        <p>마케팅 기획안 실습물 정리</p>
    </div>
</div>

<div id="modal">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <div class="modal-content" id="pdf-viewer"></div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    async function renderThumbnail(url, canvasId) {
        const loadingTask = pdfjsLib.getDocument(url);
        const pdf = await loadingTask.promise;
        const page = await pdf.getPage(1);
        const scale = 0.5;
        const viewport = page.getViewport({ scale: scale });
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        document.getElementById(canvasId).appendChild(canvas);
        document.getElementById(canvasId).classList.remove('skeleton');
        await page.render({ canvasContext: context, viewport: viewport }).promise;
    }

    renderThumbnail('./midasitseojeongeun20260422-압축됨.pdf', 'thumb-1');

    function openModal(url) {
        const modal = document.getElementById('modal');
        const viewer = document.getElementById('pdf-viewer');
        viewer.innerHTML = '';
        modal.style.display = 'flex';
        
        pdfjsLib.getDocument(url).promise.then(async pdf => {
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 1.5 });
                const canvas = document.createElement('canvas');
                canvas.className = 'page-canvas';
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                viewer.appendChild(canvas);
                page.render({ canvasContext: context, viewport: viewport });
            }
        });
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }

    window.onclick = (event) => { if (event.target == document.getElementById('modal')) closeModal(); };
    window.onkeydown = (event) => { if (event.key === 'Escape') closeModal(); };
</script>
</body>
</html>
